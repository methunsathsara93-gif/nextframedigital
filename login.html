<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal - Next Frame Digital</title>
    <!-- Supabase SDK (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #050505; /* Deep luxury black */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 74, 17, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 74, 17, 0.05) 0%, transparent 40%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* Glassmorphism Login Container */
        .login-box {
            background: rgba(17, 17, 17, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 50px 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 1;
        }

        /* Ambient Glow Behind Box */
        .login-box::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff4a11, transparent, #ff4a11);
            border-radius: 22px;
            z-index: -1;
            opacity: 0.15;
            filter: blur(10px);
        }

        /* Brand Typography */
        .brand-logo {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #888888;
            margin-bottom: 5px;
            font-weight: 500;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 50%, #a3a3a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #666666;
            font-size: 0.9rem;
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* Form Controls */
        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #888888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background-color: rgba(30, 30, 30, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .input-group input::placeholder {
            color: #444444;
        }

        /* Input Focus Glow */
        .input-group input:focus {
            border-color: #ff4a11;
            background-color: rgba(30, 30, 30, 0.8);
            box-shadow: 0 0 15px rgba(255, 74, 17, 0.15);
        }

        /* Premium Button */
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff4a11 0%, #e03d0a 100%);
            border: none;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 74, 17, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 74, 17, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Footer Notes */
        .footer-note {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #444444;
            font-weight: 400;
        }

        .footer-note a {
            color: #ff4a11;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer-note a:hover {
            color: #e03d0a;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="brand-logo">Next Frame Digital</div>
    <h2>Client Portal</h2>
    <p class="subtitle">Enter your credentials to access your gallery</p>
    
    <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@company.com" required autocomplete="off">
    </div>
    
    <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
    </div>
    
    <button id="loginBtn">Access Gallery</button>
    
    <div class="footer-note">
        Having trouble? <a href="https://wa.me/94705131882" target="_blank">Contact Support</a>
    </div>
</div>

<script>
    // ඔබේ Supabase Credentials (ඔබේ Project ID එකට අදාළව සකසා ඇත)
    const SUPABASE_URL = "https://xuxdkjeypwrhccgthepn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_dFQviBlIr8Wnj2p4xjHgDw_jqCQNzzI"; // මේ " " ඇතුළට ANON_KEY එක දාන්න!
    
    // Supabase Client එක සක්‍රීය කිරීම
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Event Listener එක හරහා Button Click එක හසුරුවා ගැනීම
    document.getElementById('loginBtn').addEventListener('click', async function(e) {
        e.preventDefault(); 
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
            alert("Please enter both Email and Password!");
            return;
        }

        // Button එකේ පෙනුම වෙනස් කිරීම (Loading state)
        const originalBtnText = this.innerText;
        this.innerText = "Verifying...";
        this.style.opacity = "0.7";

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert("Access Denied: " + error.message);
                this.innerText = originalBtnText;
                this.style.opacity = "1";
            } else {
                // සාර්ථක නම් download.html පිටුවට යොමු කිරීම
                window.location.href = "download.html";
            }
        } catch (err) {
            alert("An unexpected error occurred: " + err.message);
            this.innerText = originalBtnText;
            this.style.opacity = "1";
        }
    });
</script>

</body>
</html>

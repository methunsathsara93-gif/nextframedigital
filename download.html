<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Frame Digital | Client Access</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #050505; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 500px; width: 100%; text-align: center; }
        .glass { background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 25px; padding: 40px; }
        
        /* Status Badge */
        .status-badge { display: inline-block; padding: 5px 15px; background: rgba(255, 74, 17, 0.1); color: #ff4a11; border-radius: 20px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; margin-bottom: 15px; border: 1px solid rgba(255, 74, 17, 0.2); }
        
        .circle-wrap { width: 120px; height: 120px; background: #111; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 20px auto; border: 4px solid #ff4a11; font-weight: 600; font-size: 1.2rem; }
        .progress-bar { height: 6px; background: #222; border-radius: 3px; margin: 15px 0; overflow: hidden; }
        #fill { height: 100%; width: 0%; background: #ff4a11; transition: 2s; }
        
        .note-box { font-size: 0.85rem; color: #aaa; background: #111; padding: 15px; border-radius: 15px; border-left: 3px solid #ff4a11; text-align: left; margin-bottom: 20px; }
        .btn-dl { display: block; width: 100%; padding: 18px; background: #ff4a11; color: white; border-radius: 15px; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .btn-disabled { background: #333; color: #666; cursor: not-allowed; pointer-events: none; }
        .logout-btn { background: none; border: none; color: #666; margin-top: 30px; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
        .contact-link { display: block; margin-top: 20px; color: #ff4a11; font-size: 0.8rem; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass">
        <div style="letter-spacing: 4px; font-size: 0.6rem; color: #666; margin-bottom: 20px;">NEXT FRAME DIGITAL</div>
        
        <!-- Status Badge -->
        <div class="status-badge" id="status-text">Loading...</div>
        
        <h2 id="name">Hi, Client!</h2>
        
        <div class="circle-wrap" id="prog-circle">0%</div>
        <div class="progress-bar"><div id="fill"></div></div>
        <p id="countdown" style="font-size: 0.75rem; color: #ff4a11; margin-bottom: 20px;">Delivery: Calculating...</p>

        <div class="note-box" id="editor-notes">Loading project status...</div>
        
        <a href="#" id="dl-btn" class="btn-dl btn-disabled">DOWNLOAD GALLERY</a>
        <a href="https://wa.me/947XXXXXXXX" class="contact-link">If you have any questions, please contact us</a>
        
        <button class="logout-btn" onclick="signOut()">LOGOUT ACCOUNT</button>
    </div>
</div>

<script>
    const client = supabase.createClient("https://xuxdkjeypwrhccgthepn.supabase.co", "sb_publishable_dFQviBlIr8Wnj2p4xjHgDw_jqCQNzzI");

    async function load() {
        const { data: { user } } = await client.auth.getUser();
        if(!user) { window.location.href = "login.html"; return; }

        const { data } = await client.from('client_galleries').select('*').eq('client_email', user.email).single();
        
        if(data) {
            document.getElementById('name').innerText = "Hi, " + data.client_name + "!";
            document.getElementById('status-text').innerText = data.status || "In Progress"; // Status එක පෙන්වයි
            document.getElementById('prog-circle').innerText = data.progress + "%";
            document.getElementById('fill').style.width = data.progress + "%";
            document.getElementById('editor-notes').innerText = data.notes || "No updates yet.";

            const dlBtn = document.getElementById('dl-btn');
            if(data.progress >= 100) {
                dlBtn.classList.remove('btn-disabled');
                dlBtn.href = data.download_link;
                dlBtn.innerText = "DOWNLOAD FULL ALBUM ↓";
            }

            if(data.delivery_date) {
                const diff = Math.ceil((new Date(data.delivery_date) - new Date()) / (1000 * 60 * 60 * 24));
                document.getElementById('countdown').innerText = diff > 0 ? "Delivery in: " + diff + " Days" : "Delivery: Ready/Overdue";
            }
        }
    }

    async function signOut() { 
        await client.auth.signOut(); 
        window.location.href = "login.html"; 
    }
    
    load();
    setInterval(load, 30000);
</script>
</body>
</html>

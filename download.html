<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Gallery - Next Frame Digital</title>
    <!-- Supabase SDK (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #030303; /* Ultramatte luxury black */
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(255, 74, 17, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(255, 74, 17, 0.03) 0%, transparent 40%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
        }

        /* Glassmorphism Portal Container */
        .portal-card {
            background: rgba(13, 13, 13, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 60px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            animation: fadeInUp 0.8s ease-out;
        }

        /* Ambient Glow Effect */
        .portal-card::after {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(135deg, rgba(255, 74, 17, 0.3), transparent 40%, rgba(255, 74, 17, 0.1));
            border-radius: 25px;
            z-index: -1;
            pointer-events: none;
        }

        /* Brand Logo Top */
        .brand-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* User Welcome Section */
        .welcome-badge {
            display: inline-block;
            background: rgba(255, 74, 17, 0.1);
            border: 1px solid rgba(255, 74, 17, 0.2);
            color: #ff4a11;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 40%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-email {
            font-size: 0.9rem;
            color: #555555;
            margin-bottom: 40px;
        }

        /* The Premium Download Box */
        .download-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 35px 25px;
            margin-bottom: 40px;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
        }

        .download-box:hover {
            transform: translateY(-5px);
            background: rgba(255, 74, 17, 0.02);
            border-color: rgba(255, 74, 17, 0.3);
            box-shadow: 0 15px 30px rgba(255, 74, 17, 0.05);
        }

        /* Custom Folder Icon with Glow */
        .icon-wrapper {
            width: 70px;
            height: 70px;
            background: rgba(255, 74, 17, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            border: 1px solid rgba(255, 74, 17, 0.2);
            transition: all 0.4s ease;
        }

        .download-box:hover .icon-wrapper {
            background: #ff4a11;
            box-shadow: 0 0 25px rgba(255, 74, 17, 0.6);
            border-color: #ff4a11;
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
            fill: #ff4a11;
            transition: fill 0.4s ease;
        }

        .download-box:hover .icon-wrapper svg {
            fill: #ffffff;
        }

        .download-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .download-desc {
            font-size: 0.85rem;
            color: #666666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Action Button */
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff4a11 0%, #e03d0a 100%);
            border: none;
            color: #ffffff !important;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 74, 17, 0.3);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 74, 17, 0.5);
        }

        /* Sleek Logout Button */
        .btn-logout {
            background: none;
            border: none;
            color: #666666;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 10px;
        }

        .btn-logout:hover {
            color: #ff4a11;
        }

        /* Entrance Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .portal-card {
                padding: 40px 25px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="portal-card">
    <div class="brand-header">Next Frame Digital</div>
    
    <div class="welcome-badge">Client Gallery Access</div>
    
    <!-- පරිශීලකයාගේ නම මෙතනට වැටේ -->
    <h1 id="user-name">Welcome Back!</h1>
    <div class="user-email" id="user-email">Verifying session...</div>

    <!-- ඩවුන්ලෝඩ් සෙක්ෂන් එක (Default පේන්න තියෙනවා, ලින්ක් නැත්නම් වෙනස් වේ) -->
    <div class="download-box" id="gallery-section">
        <div class="icon-wrapper">
            <!-- Sleek Folder Icon -->
            <svg viewBox="0 0 24 24">
                <path d="M20 6h-8l-2-2H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-1 11H5v-2h14v2zm0-4H5V8h14v5z"/>
            </svg>
        </div>
        <div class="download-title">Download Your Gallery</div>
        <p class="download-desc" id="gallery-desc">ඔබගේ ප්‍රසංගයේ/උත්සවයේ සියලුම උසස් තත්ත්වයේ (High-Resolution) ඡායාරූප පහත බොත්තම මඟින් බාගත කරගන්න.</p>
        
        <a href="#" id="download-btn" class="btn-download" target="_blank" style="display: none;">
            Download Full Album 
            <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24">
                <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
            </svg>
        </a>
    </div>

    <!-- Logout button එක වෙනම function එකකට බැඳ ඇත -->
    <button id="logout-btn" class="btn-logout">Logout Account</button>
</div>

<script>
    // ඔබේ Supabase Credentials
    const SUPABASE_URL = "https://xuxdkjeypwrhccgthepn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_dFQviBlIr8Wnj2p4xjHgDw_jqCQNzzI"; // මේ " " ඇතුළට ඔයාගේ දිග ANON_KEY එක දාන්න!
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkUser() {
        try {
            // ලොග් වී සිටින පරිශීලකයාගේ තොරතුරු ලබා ගැනීම
            const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
            
            if (userError || !user) {
                console.log("No user session found, redirecting to login.");
                window.location.href = "login.html";
                return;
            }

            // ක්ලයන්ට්ගේ Email එක පෙන්වීම
            document.getElementById('user-email').innerText = "Account: " + user.email;

            // Database query එක
            const { data, error } = await supabaseClient
                .from('client_galleries')
                .select('client_name, download_link')
                .eq('client_email', user.email); // .single() වෙනුවට සාමාන්‍ය Query එකක් කරමු Error නොවෙන්න

            if (error) {
                console.error("Database query error:", error);
                alert("Database Error: " + error.message);
                return;
            }

            if (data && data.length > 0) {
                const clientData = data[0];
                const clientName = clientData.client_name ? clientData.client_name : "Client";
                document.getElementById('user-name').innerText = "Hi, " + clientName + "!";
                
                // ඩවුන්ලෝඩ් ලින්ක් එක බොත්තමට සෙට් කිරීම
                if (clientData.download_link) {
                    const dlBtn = document.getElementById('download-btn');
                    dlBtn.href = clientData.download_link;
                    dlBtn.style.display = "inline-flex";
                } else {
                    document.getElementById('gallery-desc').innerText = "No download link found. Please contact support.";
                }
            } else {
                document.getElementById('user-name').innerText = "Welcome!";
                document.getElementById('gallery-desc').innerText = "No matching email in database. Please check your registered email with Next Frame Digital.";
            }

        } catch (err) {
            console.error("Critical error in checkUser:", err);
            alert("An error occurred: " + err.message);
        }
    }

    // Logout Function එක 
    document.getElementById('logout-btn').addEventListener('click', async function() {
        try {
            const { error } = await supabaseClient.auth.signOut();
            if (error) {
                alert("Logout failed: " + error.message);
            } else {
                window.location.href = "login.html";
            }
        } catch (err) {
            alert("Logout error: " + err.message);
        }
    });

    // පිටුව ලෝඩ් වූ සැනින් ක්‍රියාත්මක කිරීම
    window.onload = function() {
        checkUser();
    };
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frame Masters Community</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
body{
margin:0;
font-family:Poppins;
background:#0a0a0a;
color:white;
}

header{
padding:20px;
text-align:center;
background:#111;
position:sticky;
top:0;
z-index: 100;
}

h1{color:#ff4d00;}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.auth-box, .post-box, .post{
background:#111;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

input, textarea, select{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
background:#000;
color:white;
box-sizing: border-box;
}

button{
background:#ff4d00;
border:none;
padding:10px 20px;
color:white;
border-radius:8px;
cursor:pointer;
font-weight: 500;
margin-top: 5px;
}

button:hover {
background:#e04300;
}

.badge{
color:#00ff88;
font-size:12px;
margin-left:8px;
}

.like{
color:#ff4d00;
cursor:pointer;
display: inline-block;
margin-top: 10px;
}

.comment{
font-size:14px;
margin-top:5px;
padding-left:10px;
border-left:2px solid #ff4d00;
}

.comment-form {
margin-top: 15px;
background: #1a1a1a;
padding: 10px;
border-radius: 8px;
}

.auth-msg {
color: #aaa;
font-style: italic;
text-align: center;
padding: 10px;
}

.hidden {
display: none !important;
}

.user-info {
display: flex;
flex-direction: column;
gap: 10px;
background: #1a1a1a;
padding: 15px;
border-radius: 8px;
margin-bottom: 15px;
}

.user-header-row {
display: flex;
justify-content: space-between;
align-items: center;
}

.name-setup-box {
background: #222;
padding: 10px;
border-radius: 6px;
margin-top: 5px;
}

/* Edit & Delete Buttons Styling */
.post-actions {
margin-top: 10px;
display: flex;
gap: 10px;
}

.btn-edit {
background: #333;
color: #00ff88;
font-size: 13px;
padding: 5px 12px;
}

.btn-edit:hover {
background: #444;
}

.btn-delete {
background: #333;
color: #ff4d4d;
font-size: 13px;
padding: 5px 12px;
}

.btn-delete:hover {
background: #8b0000;
color: white;
}

/* Edit Form Wrapper */
.edit-box {
background: #1a1a1a;
padding: 15px;
border-radius: 8px;
margin-top: 10px;
border: 1px solid #00ff88;
}
</style>
</head>

<body>

<header>
<h1>🎓 Frame Masters Community</h1>
<p>Learn • Share • Grow</p>
</header>

<div class="container">

<div id="auth-section" class="auth-box">
    
    <div id="auth-logged-out">
        <h3 id="auth-title">Sign In / Sign Up</h3>
        
        <div id="main-auth-inputs">
            <input id="auth-email" type="email" placeholder="Email Address">
            <input id="auth-password" type="password" placeholder="Password">
        </div>
        
        <div id="verification-otp-box" class="hidden" style="margin: 10px 0; padding: 15px; background: #222; border-radius: 8px; border: 1px solid #ff4d00;">
            <p id="otp-message-text" style="margin:0 0 8px 0; color: #00ff88; font-size:14px; font-weight: bold;">📬 Enter the 6-Digit Code sent to your email:</p>
            <input id="verification-token" placeholder="X X X X X X" style="text-align: center; font-size: 18px; letter-spacing: 5px;">
            
            <button id="btn-verify-signup" onclick="handleVerifyOTP()" class="hidden" style="background:#00ff88; color:#000; width: 100%;">Verify & Complete Sign Up</button>
            <button id="btn-verify-reset" onclick="handleVerifyResetOTP()" class="hidden" style="background:#ff4d00; color:#fff; width: 100%;">Verify Recovery Code</button>
        </div>

        <div id="reset-password-actions" class="hidden">
            <p style="color: #ff4d00; margin: 0 0 5px 0;">Enter your new secure password:</p>
            <input id="new-password-input" type="password" placeholder="New Password (At least 6 chars)">
            <button onclick="handlePasswordUpdate()" style="background: #00ff88; color: #000; width: 100%;">Save New Password</button>
            <button onclick="cancelResetMode()" style="background: #333; width: 100%; margin-top: 5px;">Cancel</button>
        </div>

        <div id="auth-action-buttons">
            <button onclick="handleSignUp()">Sign Up</button>
            <button onclick="handleLogin()">Log In</button>
            <button onclick="showForgotPasswordPanel()" style="background: #333; margin-left: 5px;">Forgot Password?</button>
        </div>
    </div>

    <div id="auth-logged-in" class="hidden">
        <div class="user-info">
            <div class="user-header-row">
                <span id="user-display-email"></span>
                <button onclick="handleLogout()" style="background:#444;">Log Out</button>
            </div>
            
            <div id="name-setup" class="name-setup-box">
                <p style="margin: 0 0 5px 0; font-size: 14px; color: #ff4d00;">Set your Display Name for articles:</p>
                <div style="display:flex; gap:10px;">
                    <input id="custom-display-name" placeholder="Enter your display name...">
                    <button onclick="saveDisplayName()" style="margin-top:5px; padding: 0 15px;">Save</button>
                </div>
            </div>
            <div id="name-confirmed" class="hidden" style="font-size:14px; color:#00ff88;">
                ✍️ Posting as: <strong id="current-display-name"></strong>
                <button onclick="showNameEdit()" style="background:transparent; color:#aaa; font-size:11px; text-decoration:underline; padding:0; margin-left:10px;">Change Name</button>
            </div>
        </div>
    </div>
</div>

<div id="write-article-box" class="post-box hidden">
    <h3>Write New Article</h3>
    <input id="title" placeholder="Title">
    <select id="category">
        <option>Photography</option>
        <option>Videography</option>
        <option>Drone</option>
        <option>Editing</option>
        <option>Business</option>
        <option>Other</option>
    </select>
    <textarea id="content" placeholder="Write your knowledge or Ask questions..."></textarea>
    <button onclick="createPost()">Publish</button>
</div>
<div id="article-auth-fallback" class="auth-box auth-msg">
    🔒 Please log in to publish an article.
</div>

<div id="posts"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

// --- ⚠️ CONFIGURATION: EMAILJS KEYS ⚠️ ---
const EMAILJS_PUBLIC_KEY = "BfYhVgEzC9u9r-Zmm"; 
const EMAILJS_SERVICE_ID = "service_gvkx9i8"; 
const EMAILJS_SIGNUP_TEMPLATE_ID = "template_lfamcep"; 
const EMAILJS_RESET_TEMPLATE_ID = "template_k5twnpu"; 

const supabaseUrl = "https://xyclocphoiptjekwfjnc.supabase.co";
const supabaseKey = "sb_publishable_M4-FbzuUKIxiBmRJicI1jA_zoCu9-IV";

// Initialize APIs
emailjs.init(EMAILJS_PUBLIC_KEY);
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let currentUser = null;
let userDisplayName = "";

supabase.auth.onAuthStateChange((event, session) => {
    if (session) {
        currentUser = session.user;
        userDisplayName = currentUser.user_metadata?.display_name || "";
        updateUI(true);
    } else {
        currentUser = null;
        userDisplayName = "";
        updateUI(false);
    }
    loadPosts(); 
});

function updateUI(isLoggedIn) {
    if(isLoggedIn) {
        document.getElementById("auth-logged-out").classList.add("hidden");
        document.getElementById("auth-logged-in").classList.remove("hidden");
        document.getElementById("user-display-email").innerText = `Account: ${currentUser.email}`;
        document.getElementById("write-article-box").classList.remove("hidden");
        document.getElementById("article-auth-fallback").classList.add("hidden");
        
        if (userDisplayName) {
            document.getElementById("name-setup").classList.add("hidden");
            document.getElementById("name-confirmed").classList.remove("hidden");
            document.getElementById("current-display-name").innerText = userDisplayName;
        } else {
            document.getElementById("name-setup").classList.remove("hidden");
            document.getElementById("name-confirmed").classList.add("hidden");
        }
    } else {
        if (!document.getElementById("reset-password-actions").classList.contains("hidden")) return;
        
        document.getElementById("auth-logged-out").classList.remove("hidden");
        document.getElementById("auth-logged-in").classList.add("hidden");
        document.getElementById("write-article-box").classList.add("hidden");
        document.getElementById("article-auth-fallback").classList.remove("hidden");
    }
}

// --- Display Name Handler ---
async function saveDisplayName() {
    const chosenName = document.getElementById("custom-display-name").value.trim();
    if(!chosenName) return alert("Please type a valid name!");

    const { error } = await supabase.auth.updateUser({
        data: { display_name: chosenName }
    });

    if(error) {
        alert(error.message);
    } else {
        userDisplayName = chosenName;
        alert("Display name updated successfully!");
        updateUI(true);
        loadPosts();
    }
}

function showNameEdit() {
    document.getElementById("custom-display-name").value = userDisplayName;
    document.getElementById("name-setup").classList.remove("hidden");
    document.getElementById("name-confirmed").classList.add("hidden");
}

// --- SIGN UP FLOW ---
async function handleSignUp() {
    const email = document.getElementById("auth-email").value.trim();
    const password = document.getElementById("auth-password").value.trim();
    
    if(!email || !password) return alert("Please fill in email and password fields.");

    const { data, error } = await supabase.auth.signUp({ email, password });
    if(error) return alert(error.message);

    await supabase.auth.signOut(); 

    const uniqueVerificationCode = Math.floor(100000 + Math.random() * 900000).toString();

    sessionStorage.setItem("pending_signup_email", email);
    sessionStorage.setItem("pending_signup_password", password);
    sessionStorage.setItem("pending_signup_otp", uniqueVerificationCode);

    document.getElementById("verification-token").value = ""; 

    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_SIGNUP_TEMPLATE_ID, {
        to_email: email,
        token_code: uniqueVerificationCode
    })
    .then(() => {
        alert("A 6-digit security code has been sent to your email. Please verify!");
        
        document.getElementById("main-auth-inputs").classList.add("hidden");
        document.getElementById("auth-action-buttons").classList.add("hidden");
        document.getElementById("otp-message-text").innerText = "📬 Enter the Sign Up Verification Code:";
        document.getElementById("btn-verify-signup").classList.remove("hidden");
        document.getElementById("btn-verify-reset").classList.add("hidden");
        document.getElementById("verification-otp-box").classList.remove("hidden");
    })
    .catch((err) => {
        alert("EmailJS Sign Up Delivery Error: " + JSON.stringify(err));
    });
}

async function handleVerifyOTP() {
    const userEnteredCode = document.getElementById("verification-token").value.trim();
    const realEmail = sessionStorage.getItem("pending_signup_email");
    const realPassword = sessionStorage.getItem("pending_signup_password");
    const generatedOTP = sessionStorage.getItem("pending_signup_otp");

    if (userEnteredCode === generatedOTP && realEmail) {
        alert("Code confirmed successfully! Logging you in...");
        const { error } = await supabase.auth.signInWithPassword({ email: realEmail, password: realPassword });
        if (error) {
            alert(error.message);
        } else {
            document.getElementById("verification-otp-box").classList.add("hidden");
            document.getElementById("main-auth-inputs").classList.remove("hidden");
            document.getElementById("auth-action-buttons").classList.remove("hidden");
            document.getElementById("verification-token").value = ""; 
            sessionStorage.clear();
        }
    } else {
        alert("Incorrect verification code. Please check your email again.");
    }
}

// --- FORGOT PASSWORD FLOW ---
async function showForgotPasswordPanel() {
    const email = document.getElementById("auth-email").value.trim();
    if (!email) return alert("Please type your Email address first in the input box!");

    const resetOTPCode = Math.floor(100000 + Math.random() * 900000).toString();
    
    sessionStorage.setItem("reset_password_email", email);
    sessionStorage.setItem("reset_password_otp", resetOTPCode);

    document.getElementById("verification-token").value = ""; 

    alert("Sending verification code via EmailJS...");
    
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_RESET_TEMPLATE_ID, {
        to_email: email,
        token_code: resetOTPCode
    })
    .then(() => {
        alert("A 6-digit password recovery code has been sent to your email!");
        
        document.getElementById("main-auth-inputs").classList.add("hidden");
        document.getElementById("auth-action-buttons").classList.add("hidden");
        document.getElementById("otp-message-text").innerText = "🔒 Enter the Password Reset Code:";
        document.getElementById("btn-verify-reset").classList.remove("hidden");
        document.getElementById("btn-verify-signup").classList.add("hidden");
        document.getElementById("verification-otp-box").classList.remove("hidden");
    })
    .catch((err) => {
        alert("EmailJS Reset Code Error: " + JSON.stringify(err));
    });
}

async function handleVerifyResetOTP() {
    const enteredCode = document.getElementById("verification-token").value.trim();
    const correctCode = sessionStorage.getItem("reset_password_otp");
    const email = sessionStorage.getItem("reset_password_email");

    if (enteredCode === correctCode && email) {
        alert("Code verified successfully!");
        document.getElementById("verification-token").value = ""; 

        document.getElementById("verification-otp-box").classList.add("hidden");
        document.getElementById("auth-title").innerText = "Set New Password";
        document.getElementById("reset-password-actions").classList.remove("hidden");
    } else {
        alert("Invalid recovery code. Please check your email again.");
    }
}

async function handlePasswordUpdate() {
    const newPassword = document.getElementById("new-password-input").value;
    const email = sessionStorage.getItem("reset_password_email");
    
    if (!newPassword || newPassword.length < 6) return alert("Password must be at least 6 characters.");

    alert("Saving your new password securely...");

    const { data, error } = await supabase.rpc('admin_reset_password', {
        user_email: email,
        new_password: newPassword
    });

    if (error) {
        alert("Error updating password: " + error.message);
    } else if (data === 'User not found') {
        alert("Error: No account found with this email address.");
    } else {
        alert("✨ Password updated successfully! You can now log in with your new password.");
        cancelResetMode();
    }
}

function cancelResetMode() {
    document.getElementById("auth-title").innerText = "Sign In / Sign Up";
    document.getElementById("main-auth-inputs").classList.remove("hidden");
    document.getElementById("auth-action-buttons").classList.remove("hidden");
    document.getElementById("reset-password-actions").classList.add("hidden");
    document.getElementById("verification-otp-box").classList.add("hidden");
    document.getElementById("auth-email").value = "";
    document.getElementById("auth-password").value = "";
    document.getElementById("verification-token").value = "";
    document.getElementById("new-password-input").value = "";
    sessionStorage.clear();
    updateUI(false);
}

// --- Standard Login & Logout ---
async function handleLogin() {
    const email = document.getElementById("auth-email").value.trim();
    const passwordValue = document.getElementById("auth-password").value.trim();
    const { error } = await supabase.auth.signInWithPassword({ email, password: passwordValue });
    if(error) alert(error.message);
}

async function handleLogout() {
    await supabase.auth.signOut();
}

// --- 🔥 NEW FEATURE: EDIT & DELETE ARTICLES LOGIC 🔥 ---

// 1. පෝස්ට් එකක් සූපාබේස් එකෙන් මකන ෆන්ක්ෂන් එක
async function deletePost(postId) {
    if (!confirm("Are you sure you want to delete this article? This cannot be undone.")) return;

    const { error } = await supabase.from("posts").delete().eq("id", postId);

    if (error) {
        alert("Error deleting post: " + error.message);
    } else {
        alert("🗑️ Article deleted successfully from database!");
        loadPosts(); // පෝස්ට් ලිස්ට් එක රීෆ්‍රෙෂ් කරනවා
    }
}

// 2. එඩිට් කරන්න ඕන පැනල් එක ස්ක්‍රීන් එකේ පෙන්වන ෆන්ක්ෂන් එක
function showEditForm(postId, currentTitle, currentContent) {
    const editBox = document.getElementById(`edit-wrapper-${postId}`);
    
    // දැනට තියෙන ඩේටා ටෙක්ස්ට් বক্স වලට දාලා පෙන්වනවා
    editBox.innerHTML = `
        <div class="edit-box">
            <h4>✏️ Edit Article</h4>
            <input id="edit-title-${postId}" value="${currentTitle}" placeholder="Edit Title">
            <textarea id="edit-content-${postId}" rows="5" placeholder="Edit Content">${currentContent}</textarea>
            <button onclick="saveEditedPost(${postId})" style="background: #00ff88; color: #000;">Save Changes</button>
            <button onclick="loadPosts()" style="background: #333; margin-left: 5px;">Cancel</button>
        </div>
    `;
    editBox.classList.remove("hidden");
}

// 3. වෙනස් කරපු අලුත් ඩේටා ටික සූපාබේස් එකට යවලා සේව් කරන ෆන්ක්ෂන් එක
async function saveEditedPost(postId) {
    const updatedTitle = document.getElementById(`edit-title-${postId}`).value.trim();
    const updatedContent = document.getElementById(`edit-content-${postId}`).value.trim();

    if (!updatedTitle || !updatedContent) return alert("Fields cannot be empty!");

    const { error } = await supabase
        .from("posts")
        .update({ title: updatedTitle, content: updatedContent })
        .eq("id", postId);

    if (error) {
        alert("Error updating article: " + error.message);
    } else {
        alert("✨ Article updated and synced with Database successfully!");
        loadPosts();
    }
}

// --- Post & Feed Actions ---
async function loadPosts() {
    const { data, error } = await supabase.from("posts").select("*").order("id", { ascending:false });
    if(error) return console.log(error);

    const box = document.getElementById("posts");
    box.innerHTML = "";

    for(const post of data){
        const isVerified = post.verified === true;
        const commentFormHTML = currentUser 
            ? `<div class="comment-form"><input id="cmsg-${post.id}" placeholder="Write a comment..."><button onclick="addComment(${post.id})">Comment</button></div>`
            : `<div class="auth-msg" style="font-size:12px; margin-top:10px;">🔒 Log in to comment on this article.</div>`;

        // 🌟 ලොග් වෙලා ඉන්න කෙනාගේ නමයි, පෝස්ට් එක දාපු කෙනාගේ නමයි සමාන නම් විතරක් බටන්ස් පෙන්වනවා
        let actionButtonsHTML = "";
        if (currentUser && userDisplayName && post.author === userDisplayName) {
            actionButtonsHTML = `
                <div class="post-actions">
                    <button class="btn-edit" onclick="showEditForm(${post.id}, \`${post.title.replace(/'/g, "\\'")}\`, \`${post.content.replace(/'/g, "\\'")}\`)">✏️ Edit</button>
                    <button class="btn-delete" onclick="deletePost(${post.id})">🗑️ Delete</button>
                </div>
            `;
        }

        box.innerHTML += `
            <div class="post">
                <h3>${post.title}</h3>
                <p>By <strong>${post.author || 'Anonymous'}</strong> ${isVerified ? '<span class="badge">✔ Verified by Next Frame Digital</span>' : ''}</p>
                <p><strong>Category:</strong> ${post.category}</p>
                <p style="white-space: pre-wrap;">${post.content}</p>
                
                <div id="edit-wrapper-${post.id}" class="hidden"></div>

                ${actionButtonsHTML}

                <p class="like" onclick="likePost(${post.id}, ${post.likes || 0})">❤️ ${post.likes || 0}</p>
                ${commentFormHTML}
                <div id="comments-${post.id}" style="margin-top: 15px;"></div>
            </div>`;
        await loadComments(post.id);
    }
}

async function createPost(){
    if(!currentUser) return alert("You must be logged in to post!");
    if(!userDisplayName) return alert("Please save a Display Name first!");
    const title = document.getElementById("title").value;
    const category = document.getElementById("category").value;
    const content = document.getElementById("content").value;
    if(!title || !content) return alert("Please fill in all fields.");

    await supabase.from("posts").insert([{ title, author: userDisplayName, category, content, likes:0, verified:false }]);
    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
    loadPosts();
}

async function addComment(postId){
    if(!currentUser) return alert("You must be logged in to comment!");
    const commenterName = userDisplayName || currentUser.email.split('@')[0];
    const comment = document.getElementById("cmsg-"+postId).value;
    if(!comment) return alert("Comment cannot be empty.");

    await supabase.from("comments").insert([{ post_id: postId, name: commenterName, comment }]);
    document.getElementById("cmsg-"+postId).value = "";
    loadComments(postId);
}

async function loadComments(postId){
    const { data } = await supabase.from("comments").select("*").eq("post_id", postId).order("id", { ascending:false });
    const box = document.getElementById("comments-"+postId);
    if(!box || !data) return;
    box.innerHTML = "";
    data.forEach(c => { box.innerHTML += `<div class="comment"><b>${c.name}:</b> ${c.comment}</div>`; });
}

async function likePost(id, likes){
    await supabase.from("posts").update({ likes: likes + 1 }).eq("id", id);
    loadPosts();
}

// Global scope mapping
window.addComment = addComment;
window.likePost = likePost;
window.createPost = createPost;
window.handleSignUp = handleSignUp;
window.handleLogin = handleLogin;
window.handleLogout = handleLogout;
window.saveDisplayName = saveDisplayName;
window.showNameEdit = showNameEdit;
window.showForgotPasswordPanel = showForgotPasswordPanel;
window.handleVerifyResetOTP = handleVerifyResetOTP;
window.handlePasswordUpdate = handlePasswordUpdate;
window.cancelResetMode = cancelResetMode;
window.handleVerifyOTP = handleVerifyOTP;

// New functions mapping
window.deletePost = deletePost;
window.showEditForm = showEditForm;
window.saveEditedPost = saveEditedPost;

});
</script>

</body>
</html>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#0a0a0a;color:#fff;scroll-behavior:smooth;overflow-x: hidden;}

/* 🌟 STICKY NAVIGATION */
nav{display:flex;justify-content:space-between;align-items:center;padding:15px 40px;background:rgba(0,0,0,0.8);position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px); border-bottom: 1px solid #111;}
nav img{height:45px;}
nav ul{display:flex;gap:20px;list-style:none;}
nav li{cursor:pointer;transition: 0.3s;font-weight: 500;}
nav li:hover{color:#ff4d00;}

section{padding:60px 40px;}

/* 🌌 HERO SECTION */
.hero-container {
    position: relative;
    width: 100%;
    min-height: 40vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: linear-gradient(180deg, #000 0%, #0a0a0a 100%);
    padding: 40px;
}

.gallery-svg-container {
    position: absolute;
    top: 15%;
    width: 80px;
    height: auto;
    z-index: 1;
    pointer-events: none;
    animation: gallery-bob 4s ease-in-out infinite;
}

@keyframes gallery-bob {
    0%, 100% { transform: translateY(0) rotate(0deg); filter: drop-shadow(0 0 5px rgba(255,77,0,0.4)); }
    50% { transform: translateY(-10px) rotate(3deg); filter: drop-shadow(0 0 15px rgba(255,77,0,0.7)); }
}

/* 🎯 FILTER BUTTONS */
.buttons{
    text-align:center;
    margin-bottom:40px;
    position: relative;
    z-index: 10;
}

.buttons button{
    background:#111;
    border: 1px solid #222;
    color:#ccc;
    padding: 12px 24px;
    margin: 6px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.5px;
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
}

.buttons button:hover, .buttons button.active {
    background: #ff4d00;
    color: white;
    border-color: #ff4d00;
    box-shadow: 0 8px 20px rgba(255, 77, 0, 0.3);
    transform: translateY(-3px);
}

/* 📸 GALLERY GRID DESIGN */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
    max-width: 1400px;
    margin: 0 auto;
}

/* IMAGE CARD CONTAINER */
.gallery-item {
    position: relative;
    border-radius: 15px;
    overflow: hidden;
    background: #111;
    border: 1px solid #1c1c1c;
    aspect-ratio: 3/2;
    transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
    opacity: 1;
    transform: scale(1);
}

/* ෆිල්ටර් කරද්දී සිදුවන Smooth ඇනිමේෂන් එක */
.gallery-item.hidden {
    opacity: 0;
    transform: scale(0.8);
    position: absolute;
    pointer-events: none;
    width: 0;
    height: 0;
    padding: 0;
    margin: 0;
    border: none;
}

.gallery img{
    width:100%;
    height: 100%;
    object-fit: cover;
    transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
    cursor:pointer;
    filter: grayscale(15%);
}

/* Hover Overlay Visual Effect */
.gallery-item::after {
    content: 'View Image 🔍';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 77, 0, 0.15);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; letter-spacing: 1px;
    opacity: 0; transition: 0.4s; pointer-events: none;
}

.gallery-item:hover{
    transform: translateY(-8px);
    border-color: #ff4d00;
    box-shadow: 0 12px 30px rgba(255, 77, 0, 0.25);
}

.gallery-item:hover img {
    transform: scale(1.06);
    filter: grayscale(0%);
}

.gallery-item:hover::after {
    opacity: 1;
}

/* 🖼️ LIGHTBOX MODAL STYLING (Full Screen Viewer) */
.lightbox {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(15px);
    z-index: 2000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
}
.lightbox.show { opacity: 1; pointer-events: auto; }

.lightbox-content {
    max-width: 85%;
    max-height: 80vh;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(255, 77, 0, 0.3);
    border: 1px solid rgba(255, 77, 0, 0.5);
    transform: scale(0.9);
    transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
}
.lightbox.show .lightbox-content { transform: scale(1); }

.lightbox-close {
    position: absolute;
    top: 30px; right: 40px;
    color: #fff; font-size: 40px; font-weight: 300;
    cursor: pointer; transition: 0.3s;
}
.lightbox-close:hover { color: #ff4d00; transform: scale(1.1); }

footer{text-align:center;padding:30px;background:#000; border-top: 1px solid #111; margin-top: 60px;}
</style>

<script>
// BACK TO PREVIOUS PAGE
function goBack(){
    window.history.back();
}

// 🎯 DYNAMIC SMOOTH FILTER FUNCTION
function filterGallery(category, buttonElement) {
    // Active Button Style Switch
    const buttons = document.querySelectorAll(".buttons button");
    buttons.forEach(btn => btn.classList.remove("active"));
    buttonElement.classList.add("active");

    // Grid Animation Engine
    const items = document.querySelectorAll(".gallery-item");
    items.forEach(item => {
        if (category === "all") {
            item.classList.remove("hidden");
        } else {
            if (item.classList.contains(category)) {
                item.classList.remove("hidden");
            } else {
                item.classList.add("hidden");
            }
        }
    });
}

// 🖼️ LIGHTBOX ENGINE (OPEN/CLOSE FULLSCREEN)
function openLightbox(src) {
    const lightbox = document.getElementById("lightboxModal");
    const lightboxImg = document.getElementById("lightboxImg");
    lightboxImg.src = src;
    lightbox.classList.add("show");
}

function closeLightbox() {
    const lightbox = document.getElementById("lightboxModal");
    lightbox.classList.remove("show");
}
</script>
